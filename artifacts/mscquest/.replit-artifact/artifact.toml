kind = "web"
previewPath = "/"
title = "MSCQuest"
version = "1.0.0"
id = "artifacts/mscquest"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20991

[services.development]
run = "pnpm --filter @workspace/mscquest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mscquest", "run", "build" ]
publicDir = "artifacts/mscquest/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20991"
BASE_PATH = "/"
